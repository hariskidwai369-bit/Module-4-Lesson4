<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>My Favourite Person Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>

    body {
      background-color: #eef5ff;
    }

    h1 {
      color: #1769aa;
    }

    .info-name {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
    }

    pre {
      font-size: 13px;
      color: #222;
    }

  </style>

</head>

<body class="py-4">

  <div class="container">

    <h1 class="mb-1">
      My Favourite Person Profile
    </h1>

    <p class="text-muted mb-4">
      Learning JavaScript Objects
    </p>


    <div class="card shadow-sm mb-3"
      style="max-width:400px;">

      <div class="card-body">

        <h5 class="card-title"
          style="color:#1769aa;">
          Person Details
        </h5>

        <ul class="list-group list-group-flush">

          <li class="list-group-item">

            <span class="info-name d-block">
              Name
            </span>

            <strong id="personName">-</strong>

          </li>


          <li class="list-group-item">

            <span class="info-name d-block">
              Relationship
            </span>

            <strong id="personRelation">-</strong>

          </li>


          <li class="list-group-item">

            <span class="info-name d-block">
              Favourite Activity
            </span>

            <strong id="personActivity">-</strong>

          </li>


          <li class="list-group-item">

            <span class="info-name d-block">
              City
            </span>

            <strong id="personCity">-</strong>

          </li>

        </ul>

      </div>

    </div>


    <div class="card shadow-sm"
      style="max-width:400px;">

      <div class="card-body">

        <h6 style="color:#1769aa;">
          JavaScript Object
        </h6>

        <pre id="objectDisplay"
          class="bg-light p-3 rounded border mb-0"></pre>

      </div>

    </div>

  </div>


  <script>

    let favouritePerson = {
      name: "Albert Einstein",
      relationship: "Favourite Scientist",
      activity: "Studying Science",
      city: "Ulm"
    };


    document.getElementById("personName").innerHTML =
      favouritePerson.name;

    document.getElementById("personRelation").innerHTML =
      favouritePerson.relationship;


    document.getElementById("personActivity").innerHTML =
      favouritePerson["activity"];

    document.getElementById("personCity").innerHTML =
      favouritePerson["city"];


    document.getElementById("objectDisplay").innerHTML =
      JSON.stringify(favouritePerson, null, 2);

  </script>

</body>

</html>
