 }

<body class="py-4">
<div class="container">

<h1 class="mb-1">
 My Phone Contact
</h1>

<P class="mb-4">Introduction To Objects In Javascript</P>
<div class="card mb-3 shadow-sm" style="max-width: 400px;">
 
<div class="card-body">
<h5 class="card-title" style="color: cornflowerblue;"  >
   Contact Details 
</h5>
<ul class="list-group list-group-flush">

<li class="list-group-item">

<span class="card-label d-block">
Name
</span>
<strong id="name">-</strong>

</li>

<li class="list-group-item">
<span class="card-label d-block">
Phone
</span>
<strong id="phone">-</strong>

</li>

<li class="list-group-item">
<span class="card-label d-block">
School
</span>
<strong id="School">-</strong>

</li>

<li class="list-group-item">
<span class="card-label d-block">
City
</span>
<strong id="city">-</strong>

</li>
</ul>
</div>
</div>

<div class="card shadow-sm">
<div class="card-body">
    <h6>Javascript Object Used</h6>
    <pre id="codedisplay" class="bg-light p-3"></pre>
</div>
</div>

</div>
    <script>
    var mycontact = {
        name: "Haris Kidwai",
        phone: "03263692227",
        school: "Usman Public School System",
        city: "Karachi, Pakistan"
    }

    var NameEl = document.getElementById( "name" );
    var PhoneEl = document.getElementById( "phone" );

    NameEl.textContent = mycontact.name;
    PhoneEl.textContent = mycontact.phone;

    var SchoolEl = document.getElementById( "School" );
    var CityEl = document.getElementById( "city" );

    SchoolEl.textContent = mycontact ["school"];
    CityEl.textContent = mycontact ["city"];

    var codeEl = document.getElementById("codedisplay");


    codeEl.textContent =

    'var myContact = {\n' +

    ' name: "' + mycontact.name + '",\n' +

    ' phone: "' + mycontact.phone + '",\n' +

    ' school: "' + mycontact["school"] + '",\n' +

    ' city: "' + mycontact["city"] + '"\n' +

    '};'

        </script>
</body>
